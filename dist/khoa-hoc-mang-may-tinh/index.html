<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Khóa học: Mạng máy tính</title>
  <style>
    :root {
      --primary: #0057ff;
      --primary-dark: #0039a8;
      --accent: #ffb703;
      --ink: #1f2532;
      --muted: #5b6476;
      --surface: #ffffff;
      --surface-alt: #f2f4ff;
      --border: rgba(15, 63, 167, 0.12);
      --radius: 24px;
      --shadow: 0 20px 60px rgba(15, 87, 255, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, rgba(169, 200, 255, 0.4), transparent 55%),
        #eef2ff;
      color: var(--ink);
      line-height: 1.6;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("logo.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: min(65vw, 520px);
      opacity: 0.2;
      pointer-events: none;
      z-index: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    header.hero {
      background: linear-gradient(120deg, var(--primary), #7357ff);
      border-radius: var(--radius);
      padding: 3rem clamp(2rem, 4vw, 4.5rem);
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.35), transparent 45%);
      pointer-events: none;
    }

    .hero-logo {
      position: absolute;
      top: 1.6rem;
      right: 1.8rem;
      width: 86px;
      height: 86px;
      object-fit: contain;
      opacity: 0.9;
      z-index: 1;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.18));
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 4vw, 3.1rem);
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 0;
      max-width: 640px;
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 2rem;
    }

    .hero-actions a {
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      font-weight: 600;
      background: #fff;
      color: var(--primary);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s ease;
    }

    .hero-actions a:hover {
      transform: translateY(-3px);
    }

    .hero-stats {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }

    .stat {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 1rem 1.25rem;
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
    }

    .stat strong {
      font-size: 1.3rem;
      display: block;
    }

    section {
      margin-top: 2.5rem;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2.25rem clamp(1.5rem, 4vw, 3rem);
      box-shadow: 0 10px 35px rgba(38, 44, 82, 0.08);
      border: 1px solid var(--border);
    }

    .section-heading {
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    h2 {
      margin: 0 0 1.2rem;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
    }

    #courseList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      align-items: start;
    }

    .chapter-divider {
      grid-column: 1 / -1;
      padding: 1rem 1.3rem;
      border-radius: 18px;
      background: var(--surface-alt);
      border: 1px dashed rgba(0, 87, 255, 0.3);
      font-weight: 600;
      color: var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .lesson-card {
      background: var(--surface-alt);
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid rgba(15, 63, 167, 0.12);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 210px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .lesson-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0, 87, 255, 0.12);
    }

    .lesson-card h3 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--primary-dark);
    }

    .lesson-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: auto;
    }

    .lesson-actions a {
      flex: 1 1 120px;
      text-align: center;
      padding: 0.65rem 1rem;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .lesson-actions a.learn {
      background: #fff;
      color: var(--primary);
      border-color: rgba(0, 87, 255, 0.15);
    }

    .lesson-actions a.test {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 25px rgba(0, 87, 255, 0.18);
    }

    .lesson-actions a:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      header.hero {
        padding: 2.25rem 1.65rem;
      }

      .hero-logo {
        width: 64px;
        height: 64px;
        top: 1rem;
        right: 1rem;
      }

      section {
        padding: 1.75rem 1.35rem;
      }

      #courseList {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <img class="hero-logo" src="logo.png" alt="Logo khóa học" />
      <div class="hero-content">
        <p class="section-heading" style="color: rgba(255,255,255,0.75); letter-spacing: 0.35em;">Lộ trình</p>
        <h1>Khóa học: Mạng máy tính cơ bản</h1>
        <p>Lộ trình 31 bài học từ khái niệm mạng, phần cứng, mô hình OSI/TCP-IP đến thực hành xử lý sự cố. Mỗi bài đều có phần quiz giúp bạn tự kiểm tra kiến thức.</p>
        <div class="hero-actions">
          <a href="lessons/lesson1.html">Bắt đầu ngay</a>
        </div>
        <div class="hero-stats">
          <div class="stat"><strong>31</strong>Bài học</div>
          <div class="stat"><strong>31</strong>Bài quiz</div>
        </div>
      </div>
    </header>

    <section>
      <p class="section-heading">Chương trình</p>
      <h2>Chọn bài học hoặc làm bài test</h2>
      <div id="courseList"></div>
    </section>
  </main>

  <script src="data/lessons.js"></script>
  <script>
    const courseList = document.getElementById('courseList');

    chapters.forEach((chapter) => {
      const chapterDiv = document.createElement('div');
      chapterDiv.className = 'chapter-divider';
      chapterDiv.textContent = `Chương ${chapter.id}: ${chapter.title}`;
      courseList.appendChild(chapterDiv);

      chapter.lessons.forEach((lesson) => {
        const card = document.createElement('div');
        card.className = 'lesson-card';
        card.innerHTML = `
          <div>
            <h3>Bài ${lesson.id}: ${lesson.title}</h3>
            <p>${lesson.description || 'Học lý thuyết và thực hành với quiz đi kèm.'}</p>
          </div>
          <div class="lesson-actions">
            <a class="learn" href="lessons/lesson.html?id=${lesson.id}">📖 Học</a>
            <a class="test" href="tests/test.html?id=${lesson.id}">📝 Kiểm tra</a>
          </div>
        `;
        courseList.appendChild(card);
      });
    });
  </script>
</body>
</html>
